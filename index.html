<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            background-color: #555;
            text-align: center;
            padding: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
        }

        main {
            width: 80%;
            max-width: 900px;
            margin: 30px auto;
        }

        .card {
            background-color: white;
            padding: 30px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #333;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>我的第一个网页</h1>
        <p>欢迎来到我的个人网站</p>
    </header>

    <nav>
        <a href="#">首页</a>
        <a href="#">关于我</a>
        <a href="#">我的兴趣</a>
    </nav>

    <main>

        <div class="card">
            <h2>关于我</h2>
            <p>
                你好！这是我的第一个 HTML 网页。
                我正在学习网页设计和编程。
            </p>
        </div>

        <div class="card">
            <h2>我的兴趣</h2>
            <ul>
                <li>计算机</li>
                <li>编程</li>
                <li>游戏</li>
            </ul>
        </div>

        <div class="card">
            <h2>我的目标</h2>
            <p>
                学习 HTML、CSS 和 JavaScript，
                做出属于自己的网页。
                   </div>

    </main>

    <footer>
        <p>© 2026 我的第一个网页</p>
    </footer>

</body>
</html>
